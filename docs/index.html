<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0f33"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TCG Prices">
<link rel="apple-touch-icon" sizes="180x180" href="/gengar-tcg-prices/icon-180.png"><link rel="apple-touch-icon-precomposed" sizes="180x180" href="/gengar-tcg-prices/icon-180.png"><link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<title>Gengar TCG Prices</title>
<style>
:root{--bg:#0d0820;--card:#1c1238;--card2:#251849;--line:#3a2766;--txt:#ece6ff;--mut:#a597cf;--pur:#8b5cf6;--glow:#a855f7;--eye:#ff3b6b;--up:#4ade80;--down:#ff5c8a}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(120% 60% at 50% 0,#2a1658 0,var(--bg) 60%) fixed;color:var(--txt);font:15px/1.4 -apple-system,system-ui,sans-serif;min-height:100%}
header{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) 8px calc(env(safe-area-inset-left) + 16px);background:rgba(13,8,32,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px;display:flex;align-items:center;gap:8px;text-shadow:0 0 12px var(--glow)}h1 img{width:30px;height:30px;border-radius:8px;box-shadow:0 0 14px var(--glow)}
.upd{color:var(--mut);font-size:12px;margin-top:2px}.upd b{color:var(--eye)}
nav{display:flex;gap:8px;margin-top:10px}nav button{flex:1;padding:9px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:600;font-size:14px}
nav button.on{color:#fff;background:linear-gradient(135deg,#6d28d9,#4c1d95);box-shadow:0 0 16px rgba(168,85,247,.55);border-color:var(--glow)}
main{padding:12px calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 12px);max-width:640px;margin:auto}
.tot{background:linear-gradient(135deg,#2b1660,#1a0f33);border:1px solid var(--glow);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:0 0 22px rgba(168,85,247,.35);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.tot div small{display:block;color:var(--mut);font-size:11px}.tot div b{font-size:17px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:78px 1fr;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.c img{width:78px;border-radius:6px;box-shadow:0 0 12px rgba(168,85,247,.5)}.nm{font-weight:700;font-size:16px}.meta{color:var(--mut);font-size:12px}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--eye);color:#fff;margin-left:4px;vertical-align:2px}.tag.en{background:#4c1d95}.tag.cn{background:#b45309}
.pr{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 0;text-align:center}.pr div{background:var(--card2);border-radius:8px;padding:4px}.pr small{display:block;color:var(--mut);font-size:10px}
.src{font-size:11px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px 10px}.src span i{color:#6b5d94;font-style:normal}a{color:#c4a5ff}
.act{grid-column:1/-1;display:flex;gap:6px}.act button,.btn{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:13px;font-weight:600}
.act button.own.on{background:#6d28d9;border-color:var(--glow);box-shadow:0 0 10px var(--glow)}.act button.wish.on{background:#9d174d;border-color:var(--eye);box-shadow:0 0 10px var(--eye)}
.own-f{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--card2);padding:8px;border-radius:10px}
.own-f label{font-size:10px;color:var(--mut)}.own-f input,.own-f select{width:100%;padding:6px;border-radius:8px;border:1px solid var(--line);background:#120a28;color:var(--txt);font-size:16px}
.gl{grid-column:1/-1;font-size:13px}.up{color:var(--up)}.down{color:var(--down)}
h2{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:18px 4px 8px}.empty{color:var(--mut);text-align:center;padding:14px;border:1px dashed var(--line);border-radius:14px}
.bk{display:flex;gap:8px;margin-top:20px}
.c img,.nm{cursor:pointer}.pend{border-style:dashed;opacity:.85}.pend .meta b{color:var(--eye)}
.addb{width:100%;margin:4px 0 12px;padding:11px;border-radius:14px;border:1px dashed var(--glow);background:rgba(124,58,237,.15);color:#e9d5ff;font-weight:700;font-size:14px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(6,3,16,.8);backdrop-filter:blur(6px);overflow:auto;padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 12px)}
.sheet{max-width:640px;margin:auto;background:var(--card);border:1px solid var(--glow);border-radius:18px;padding:14px;box-shadow:0 0 30px rgba(168,85,247,.45)}
.sheet .top{display:flex;gap:12px;align-items:center}.sheet .top img{width:70px;border-radius:6px}.x{margin-left:auto;background:none;border:0;color:var(--mut);font-size:26px}
.chart{margin-top:10px;background:#120a28;border-radius:12px;padding:6px}.chart svg{width:100%;height:auto;display:block}
.leg{display:flex;gap:12px;font-size:12px;justify-content:center;margin:6px 0}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.rng{display:flex;gap:6px;margin-top:8px}.rng button{flex:1;padding:6px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:12px}.rng button.on{color:#fff;border-color:var(--glow);box-shadow:0 0 8px var(--glow)}
.sheet input,.sheet select{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:#120a28;color:var(--txt);font-size:16px;margin:4px 0 8px}.sheet label{font-size:12px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.flt{display:flex;gap:8px;align-items:center;margin-bottom:10px}.chips{display:flex;gap:6px;flex-shrink:0}
.chips button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:700;font-size:13px}
.chips button.on{color:#fff;background:#6d28d9;border-color:var(--glow);box-shadow:0 0 10px var(--glow)}
#fset{flex:1;min-width:0;padding:8px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#a855f7 50%),linear-gradient(135deg,#a855f7 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px;text-overflow:ellipsis}
.noimg{width:78px;height:108px;border-radius:6px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer}
.own-b{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:4px;vertical-align:2px;color:#0d0820;background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.6)}
.sum{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;background:linear-gradient(135deg,#2b1660,#1a0f33);border:1px solid var(--line);border-radius:10px;padding:6px;font-size:13px}.sum small{display:block;color:var(--mut);font-size:10px}
.tot.t4{grid-template-columns:repeat(4,1fr)}.tot.t4 b{font-size:14px}
.ent{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}.ent input,.ent select{margin:2px 0 4px}
.ev{display:flex;flex-direction:column;justify-content:flex-end}.del{margin-top:4px;padding:7px;border-radius:9px;border:1px solid var(--eye);background:none;color:var(--eye);font-weight:600}
#fcur{width:auto;padding:8px 10px;border-radius:999px;border:1px solid var(--glow);background:var(--card);color:#fff;font-size:16px;font-weight:700}
.c{grid-template-columns:78px minmax(0,1fr)!important}.pr{grid-template-columns:repeat(3,minmax(0,1fr))!important}.sum,.tot.t4{grid-template-columns:repeat(4,minmax(0,1fr))!important}.c>div{min-width:0}.pr div{font-size:13px;overflow-wrap:anywhere}.sum{font-size:12px}.sum>div{min-width:0;overflow-wrap:anywhere}
.jhs{cursor:pointer;color:#ffb3c7}.jhs b{color:#fff}.jhs i{color:#8f80bd;font-style:normal}
</style></head><body>
<header><h1><img src="icon.svg" alt="">Gengar TCG Prices</h1><div class="upd" id="upd">Loading…</div>
</header>
<main id="m"><div class="empty">Loading… 👻</div></main>
<div id="ov"></div>
<input type="file" id="imp" accept="application/json" hidden>
<script>window.onerror=function(m){var e=document.getElementById('m');if(e)e.innerHTML='<div class="empty">👻 App error: '+String(m).replace(/</g,'&lt;')+'<br><button class="addb" onclick="(async()=>{try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())await caches.delete(k)}catch(x){}location.replace(location.pathname+\'?r=\'+Date.now())})()">Reset app cache &amp; reload</button></div>'};
setTimeout(function(){if(!window.__boot)window.onerror('app.js did not load')},8000)</script>
<script src="app.js?v=9"></script></body></html>
